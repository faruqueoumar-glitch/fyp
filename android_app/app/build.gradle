plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}

android {
    namespace "com.pharmaaudit.os"
    compileSdk 34

    defaultConfig {
        applicationId "com.pharmaaudit.os"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "Django==6.1.3"
                install "waitress==3.0.0"
                install "zeroconf==0.35.0"
                install "requests==2.32.3"
                install "whitenoise==6.7.0"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

tasks.register("syncDjangoBackend", Copy) {
    from("${projectDir}/../../") {
        include "manage.py", "app/**", "src/**"
        exclude "**/__pycache__/**", "**/*.pyc", "*.sqlite3", "device_config.json", "src/settings/*.bak"
    }
    into "${projectDir}/src/main/python/backend"
}

tasks.named("preBuild") {
    dependsOn("syncDjangoBackend")
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.webkit:webkit:1.10.0"
}
