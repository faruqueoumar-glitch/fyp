name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-desktop.txt

      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: src.settings.dev
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          pip install -r requirements-desktop.txt
          python manage.py collectstatic --noinput

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Android Debug APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaAuditOS-Android-APK
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
