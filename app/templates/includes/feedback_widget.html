<!-- Global Floating Feedback Widget (Glassmorphic White & Teal Pill + Animated Pointing Hand) -->
<style>
  @keyframes paFeedbackEntrance {
    0% { opacity: 0; transform: translateY(24px) scale(0.92); }
    65% { opacity: 1; transform: translateY(-6px) scale(1.02); }
    85% { transform: translateY(2px) scale(0.99); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes paFeedbackBounce {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-7px); }
    65% { transform: translateY(-2px); }
  }
  @keyframes paPulseRing {
    0% { transform: scale(0.95); opacity: 0.65; }
    70% { transform: scale(1.32); opacity: 0; }
    100% { transform: scale(1.32); opacity: 0; }
  }
  @keyframes paPointHand {
    0%, 100% { transform: translateX(0) rotate(-6deg); }
    50% { transform: translateX(7px) rotate(4deg); }
  }
  #pa-feedback-anchor {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9990;
    display: none;
    align-items: center;
    gap: 8px;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
  }
  #pa-feedback-anchor.pa-visible {
    display: flex;
    animation: paFeedbackEntrance 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  #pa-feedback-anchor.pa-bouncing #pa-feedback-trigger {
    animation: paFeedbackBounce 1.15s ease-in-out infinite;
  }
  #pa-feedback-hand {
    font-size: 24px;
    line-height: 1;
    filter: drop-shadow(0 3px 6px rgba(15, 23, 42, 0.18));
    animation: paPointHand 0.95s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
  }
  #pa-feedback-trigger {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-radius: 9999px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(230, 247, 245, 0.92));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid rgba(13, 148, 136, 0.35);
    box-shadow: 0 10px 28px rgba(13, 148, 136, 0.22), 0 2px 6px rgba(15, 23, 42, 0.08);
    color: #0f3d3e;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  #pa-feedback-trigger:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 14px 32px rgba(13, 148, 136, 0.30), 0 4px 10px rgba(15, 23, 42, 0.10);
  }
  #pa-feedback-trigger::before,
  #pa-feedback-trigger::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 9999px;
    border: 2px solid rgba(13, 148, 136, 0.42);
    pointer-events: none;
    animation: paPulseRing 2.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
  }
  #pa-feedback-trigger::after {
    animation-delay: 1.2s;
  }
  #pa-feedback-popover {
    position: fixed;
    right: 20px;
    bottom: 78px;
    width: min(360px, calc(100vw - 32px));
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
    padding: 18px;
    z-index: 9995;
    display: none;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
  }
  #pa-feedback-popover.pa-open {
    display: block;
    animation: paFeedbackEntrance 0.25s ease-out forwards;
  }
  .pa-cat-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 9999px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #475569;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pa-cat-btn.pa-active {
    background: #0d9488;
    border-color: #0d9488;
    color: #ffffff;
  }
</style>

<div id="pa-feedback-anchor" aria-live="polite">
  <span id="pa-feedback-hand" title="Send us your feedback">👉</span>
  <button type="button" id="pa-feedback-trigger" aria-expanded="false" aria-controls="pa-feedback-popover">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span>Feedback</span>
  </button>
</div>

<div id="pa-feedback-popover" role="dialog" aria-label="Send Feedback">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
    <div>
      <div style="font-size:15px;font-weight:700;color:#0f172a;">Send Feedback</div>
      <div style="font-size:11px;color:#64748b;">Report an issue, idea, or suggestion directly</div>
    </div>
    <button type="button" id="pa-feedback-close" aria-label="Close feedback" style="background:none;border:none;color:#64748b;font-size:18px;cursor:pointer;padding:2px 6px;">&times;</button>
  </div>

  <div style="display:flex;gap:6px;margin-bottom:10px;" id="pa-feedback-cats">
    <button type="button" class="pa-cat-btn pa-active" data-cat="Bug">Bug</button>
    <button type="button" class="pa-cat-btn" data-cat="Idea">Idea</button>
    <button type="button" class="pa-cat-btn" data-cat="Praise">Praise</button>
    <button type="button" class="pa-cat-btn" data-cat="Other">Other</button>
  </div>

  <textarea id="pa-feedback-msg" rows="3" placeholder="Tell us what happened or what we can improve..." style="width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font-size:13px;color:#0f172a;resize:vertical;outline:none;margin-bottom:10px;"></textarea>

  <div id="pa-feedback-status" style="display:none;font-size:12px;font-weight:600;padding:7px 10px;border-radius:8px;margin-bottom:10px;"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    <button type="button" id="pa-send-email" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:10px;border:none;background:#0d9488;color:#ffffff;font-size:12.5px;font-weight:700;cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <span>Send Email</span>
    </button>
    <button type="button" id="pa-send-whatsapp" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:10px;border:1px solid #16a34a;background:#f0fdf4;color:#15803d;font-size:12.5px;font-weight:700;cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>WhatsApp</span>
    </button>
  </div>
</div>

<script>
  (function () {
    const anchor = document.getElementById('pa-feedback-anchor');
    const trigger = document.getElementById('pa-feedback-trigger');
    const hand = document.getElementById('pa-feedback-hand');
    const popover = document.getElementById('pa-feedback-popover');
    const closeBtn = document.getElementById('pa-feedback-close');
    const msgInput = document.getElementById('pa-feedback-msg');
    const statusBox = document.getElementById('pa-feedback-status');
    const emailBtn = document.getElementById('pa-send-email');
    const waBtn = document.getElementById('pa-send-whatsapp');
    if (!anchor || !trigger || !popover) return;

    let selectedCat = 'Bug';
    const userMeta = "{% if request.user.is_authenticated %}{{ request.user.get_full_name|default:request.user.username|escapejs }} ({{ request.user.role|default:'User'|escapejs }}){% else %}Visitor{% endif %}";
    const branchMeta = "{% with ph=request.pharmacy|default:request.user.pharmacy %}{% if ph %}{{ ph|escapejs }}{% else %}N/A{% endif %}{% endwith %}";

    // Reveal and bounce after 3 seconds
    setTimeout(function () {
      anchor.classList.add('pa-visible', 'pa-bouncing');
    }, 3000);

    function togglePopover(forceState) {
      const willOpen = typeof forceState === 'boolean' ? forceState : !popover.classList.contains('pa-open');
      popover.classList.toggle('pa-open', willOpen);
      trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (willOpen) {
        anchor.classList.remove('pa-bouncing');
        if (hand) hand.style.display = 'none';
        msgInput.focus();
      }
    }

    trigger.addEventListener('click', function () { togglePopover(); });
    closeBtn.addEventListener('click', function () { togglePopover(false); });

    document.querySelectorAll('#pa-feedback-cats .pa-cat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#pa-feedback-cats .pa-cat-btn').forEach(b => b.classList.remove('pa-active'));
        btn.classList.add('pa-active');
        selectedCat = btn.dataset.cat || 'Bug';
      });
    });

    function showStatus(text, isError) {
      statusBox.textContent = text;
      statusBox.style.display = 'block';
      statusBox.style.background = isError ? '#fef2f2' : '#f0fdf4';
      statusBox.style.color = isError ? '#b91c1c' : '#15803d';
      statusBox.style.border = isError ? '1px solid #fecaca' : '1px solid #bbf7d0';
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : '';
    }

    emailBtn.addEventListener('click', async function () {
      const message = (msgInput.value || '').trim();
      if (!message) {
        showStatus('Please type a short message first.', true);
        msgInput.focus();
        return;
      }
      emailBtn.disabled = true;
      emailBtn.style.opacity = '0.7';
      try {
        const res = await fetch('/feedback/submit/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken'),
          },
          body: JSON.stringify({
            category: selectedCat,
            message: message,
            page_url: window.location.href,
          }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          showStatus('Sent to PharmaAudit Support! Thank you.', false);
          msgInput.value = '';
          setTimeout(() => { togglePopover(false); statusBox.style.display = 'none'; }, 1600);
        } else {
          showStatus(data.error || 'Could not send email. Try WhatsApp below.', true);
        }
      } catch (err) {
        showStatus('Network error. You can send instantly via WhatsApp.', true);
      } finally {
        emailBtn.disabled = false;
        emailBtn.style.opacity = '1';
      }
    });

    waBtn.addEventListener('click', function () {
      const message = (msgInput.value || '').trim();
      if (!message) {
        showStatus('Please type a short message first.', true);
        msgInput.focus();
        return;
      }
      const text = [
        '*PharmaAudit OS Feedback (' + selectedCat + ')*',
        message,
        '',
        'User: ' + userMeta,
        'Branch: ' + branchMeta,
        'Page: ' + window.location.href
      ].join('\n');
      window.open('https://wa.me/2347019421217?text=' + encodeURIComponent(text), '_blank', 'noopener');
      showStatus('Opening WhatsApp...', false);
    });
  })();
</script>
