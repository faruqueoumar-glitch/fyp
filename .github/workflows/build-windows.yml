name: Build Windows Desktop Installer (.exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Collect Static Files
        env:
          DJANGO_SETTINGS_MODULE: src.settings.dev
          PYTHONPATH: ${{ github.workspace }};${{ github.workspace }}\src
        run: |
          python manage.py collectstatic --noinput

      - name: Build Windows Executable (PharmaAuditOS.exe)
        run: |
          pyinstaller --clean --noconfirm PharmaAuditOS.spec

      - name: Package Windows Client Bundle (.zip)
        run: |
          Compress-Archive -Path dist\PharmaAuditOS\* -DestinationPath PharmaAuditOS_Windows_x64.zip -Force

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaAuditOS-Windows-x64
          path: PharmaAuditOS_Windows_x64.zip
