{% extends 'base.html' %}

{% block title %}Password Reset Complete | PharmaAudit OS{% endblock %}

{% block main_content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center p-4">
    <div class="max-w-md w-full border border-slate-200 bg-white p-8 rounded-3xl shadow-xl shadow-slate-200/50">
        <div class="mb-6 border-b border-slate-100 pb-4 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Password Reset Complete</h1>
            <p class="text-xs text-slate-500 mt-1">Your password has been set successfully. You can now log in with your new password.</p>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                <a href="{% url 'login' %}" class="font-semibold text-slate-900 hover:underline transition">
                    Sign In
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
